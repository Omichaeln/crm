<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#ffffff" />
		<title>Ore and Tar CRM — offline</title>
		<style>
			:root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
			body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #fff; color: #16171b; }
			main { width: min(420px, calc(100% - 48px)); text-align: center; }
			img { width: 96px; height: 96px; object-fit: contain; margin-bottom: 24px; }
			h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.15; }
			p { margin: 0; color: #5a5a5a; line-height: 1.6; }
		</style>
	</head>
	<body>
		<main>
			<img src="/favicon.jpg" alt="Ore and Tar" />
			<h1>You're offline</h1>
			<p>Reconnect to continue using Ore and Tar CRM. Your installed app will resume automatically when the network returns.</p>
		</main>
	</body>
</html>
